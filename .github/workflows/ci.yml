name: CI

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  hooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # required for hatch-vcs

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          github-token: ${{ github.token }}

      - name: Run Hooks
        run: uv run pre-commit run -a
        shell: bash
